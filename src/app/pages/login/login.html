<div class="parent">



<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="login-card">

<h3 class="text-center mb-4">🔐 Employee Login</h3>

<form>

<div class="mb-3">
<label class="form-label">Email</label>
<div class="input-group">
<span class="input-group-text">
<i class="fa fa-envelope"></i>
</span>
<input type="email" [(ngModel)]="loginObj.email" name="email" class="form-control" placeholder="Enter email">
</div>
</div>

<div class="mb-3">
<label class="form-label">Contact Number</label>
<div class="input-group">
<span class="input-group-text">
<i class="fa fa-lock"></i>
</span>
<input type="password" [(ngModel)]="loginObj.contactNo" name="contactNo" class="form-control" placeholder="Enter contact number">
</div>
</div>

<div class="d-flex justify-content-between mb-3">
<a href="#">Forgot password?</a>
</div>

<button type="button" (click)="onLogin()" class="btn btn-login w-100 text-white" >Login</button>

<p class="text-center mt-3">
Don't have an account? <a href="#">Register</a>
</p>

</form>

</div>
</div>
